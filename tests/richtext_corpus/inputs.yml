# VENDORED from basecamp/once-campfire-rust (MIT), crates/richtext/tests/corpus/inputs.yml at
# 080f9035141ac09e1db81476a1b229ed24f08d8f.
#
# Differential corpus for the rich text pipeline. Each case is a stored message body (the raw
# action_text_rich_texts.body column). reference-tools/richtext/generate.rb expands the
# placeholders, runs the real Rails pipeline in the campfire-reference image, and writes
# expected.json next to this file.
#
# Placeholders:
#   {{sgid:NAME}}          the user's attachable SGID
#   {{mention:NAME}}       a Lexxy mention attachment (test_helper.rb's mention_attachment_for)
#   {{tampered:NAME}}      the SGID's message with an invalid signature
#   {{rails7:NAME}}        a Rails 7 (Marshal) SGID with an invalid signature
#   {{expired:NAME}}       an attachable SGID that expired
#   {{cross_purpose:NAME}} an SGID for another purpose
#   {{tampered_room}}      a Room SGID with an invalid signature
#   {{deleted_sgid}}       a valid SGID for a user that no longer exists
#
# Optional `host:` sets Current.request_host (default once.campfire.test).

cases:
  # --- Fixture bodies (test/fixtures/action_text/rich_texts.yml) ----------------------------
  - name: fixture first
    body: 'First post!'
  - name: fixture third
    body: 'Third time''s a charm.'
  - name: fixture fourth
    body: 'You know what the fellow said – in Italy, for thirty years under the Borgias, they had warfare, terror, murder and bloodshed, but they produced Michelangelo, Leonardo da Vinci and the Renaissance. In Switzerland, they had brotherly love, they had five hundred years of democracy and peace – and what did that produce? The cuckoo clock.'
  - name: fixture sixth
    body: 'The sense of unhappiness is so much easier to convey than that of happiness. In misery we seem aware of our own existence, even though it may be in the form of a monstrous egotism—this pain of mine is individual, this nerve that winces belongs to me and to no other. But happiness annihilates us—we lose our identity.'
  - name: fixture tenth
    body: 'I don''t care a damn about men who are loyal to the people who pay them, to organizations...I don''t think even my country means all that much. There are many countries in our blood, aren''t there, but only one person. Would the world be in the mess it is if we were loyal to love and not to countries?'
  - name: empty body
    body: ""
  - name: whitespace body
    body: "   \n\t  "
  - name: plain text with markup characters
    body: '1 < 2 && 3 > 2 "quoted" ''single'''
  - name: span only (searchable test)
    body: '<span>My hovercraft is full of eels</span>'
  - name: emoji only
    body: '😄🤘'
  - name: emoji with text
    body: 'Haha! 😄🤘'
  - name: play command
    body: '/play nonexistent_sound_name'

