# Release build matrix for the `roundhouse` binary (cargo-dist). The
# workflow this generates (.github/workflows/release.yml) publishes only
# on a version tag push (`v0.1.0`), so nothing is released until one is
# pushed. To verify the matrix without releasing, open a pull request
# that sets `pr-run-mode = "upload"` below: the PR then builds every
# target and attaches the tarballs to its workflow run, and the PR is
# closed rather than merged.
#
# Regenerate after editing: `dist generate` (the plan job checks that
# release.yml matches this file).
#
# The install line a release will offer:
#   curl --proto '=https' --tlsv1.2 -LsSf \
#     https://github.com/rubys/roundhouse/releases/latest/download/roundhouse-installer.sh | sh

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether failing tasks should make us give up on all other tasks
fail-fast = false
# Whether to install an updater program
install-updater = false
