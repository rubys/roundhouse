[package]
name = "roundhouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Sam Ruby <sam@rubyred.us>"]
description = "Rails as a specification; deployment is a build flag"
license = "MIT OR Apache-2.0"
homepage = "https://rubys.github.io/roundhouse/"
repository = "https://github.com/rubys/roundhouse"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
ruby-prism = "1.9.0"
ruby-rbs = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# LSP server: rust-analyzer's *synchronous* transport crate (no tokio —
# keeps the analysis engine sync). Host-only; the wasm build excludes it.
lsp-server = "0.7.9"
lsp-types = "0.97"
# The channel crate lsp-server's Connection.sender is built on — a
# direct dep only so the LSP's background analysis worker can name the
# sender type it clones. Keep version-compatible with lsp-server's.
crossbeam-channel = "0.5"

[build-dependencies]
# (none yet)

# Build-site archive generation. Excluded from the WASM build since
# `build-site` is a host-only binary.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tar]
version = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.flate2]
version = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zip]
version = "2"
default-features = false
features = ["deflate"]

# Build-time profile tuning. `target/debug/deps` had grown to 73G across
# 2.45M `.rcgu.o` files: macOS defaults dev builds to
# `split-debuginfo = "unpacked"`, which leaves per-codegen-unit object
# files in `deps/` for the debug map, and cargo never collects them. With
# 144 separate integration-test binaries in `tests/`, each carrying full
# debuginfo, that accumulates fast and every fingerprint pass then pays
# lookups in a multi-million-entry directory.
#
# `debug = 1` keeps line tables — backtraces still carry file/line — but
# drops local-variable info, so an lldb session can't inspect locals.
# Raise back to 2 if you need to step through roundhouse itself.
[profile.dev]
debug = 1

# Dependencies are never stepped into; their debuginfo is pure cost.
[profile.dev.package."*"]
debug = false

# Same treatment for the test profile, which is what `cargo test` builds.
[profile.test]
debug = 1

[profile.test.package."*"]
debug = false
